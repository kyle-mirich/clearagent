[project]
name = "clearagent"
version = "0.1.0"
description = "Eval-first agents with automatic local traces and replayable provider requests."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  { name = "ClearAgent contributors" },
]
keywords = ["agents", "evals", "llm", "tracing", "pytest"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "httpx>=0.27",
  "jsonschema>=4.0",
  "fastapi>=0.120",
  "uvicorn>=0.30",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.45"]
google = ["google-genai>=1.0"]
all = [
  "openai>=1.0",
  "anthropic>=0.45",
  "google-genai>=1.0",
]
pytest = ["pytest>=8.0"]
promptfoo = []

[project.scripts]
clearagent = "clearagent.cli:app"

[project.entry-points.pytest11]
clearagent = "clearagent.pytest_plugin.plugin"

[project.urls]
Homepage = "https://github.com/kyle-mirich/clearagent"
Documentation = "https://github.com/kyle-mirich/clearagent/blob/main/docs/site.md"
Source = "https://github.com/kyle-mirich/clearagent"
Issues = "https://github.com/kyle-mirich/clearagent/issues"
Changelog = "https://github.com/kyle-mirich/clearagent/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
