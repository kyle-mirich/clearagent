name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: clearagent_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d clearagent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/clearagent_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked --dev
      - run: uv run ruff check src tests
      - run: uv run python -m mypy src
      - run: uv run pytest -q
      - run: uv build
      - name: Verify installed engine wheel outside checkout
        run: >-
          uv run --isolated --no-project --directory "$(mktemp -d)" --python 3.14
          --with "$GITHUB_WORKSPACE/dist/clearagent-0.1.0-py3-none-any.whl"
          python "$GITHUB_WORKSPACE/scripts/smoke_package.py"

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --dev
      - run: uv run ruff check src tests
      - run: uv run python -m mypy src
      - run: uv run pytest -q
      - run: uv build
      - name: Verify installed engine wheel outside checkout
        run: >-
          uv run --isolated --no-project --directory "$(mktemp -d)" --python ${{ matrix.python-version }}
          --with "$GITHUB_WORKSPACE/dist/clearagent-0.1.0-py3-none-any.whl"
          python "$GITHUB_WORKSPACE/scripts/smoke_package.py"
