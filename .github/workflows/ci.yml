name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.11"
      - run: uv sync --locked --all-extras --dev
      - run: ./scripts/check.sh

  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.11"
      - run: node --check src/clearagent/chat/static/app.js
      - run: uv build
      - name: Install and inspect base wheel
        run: |
          uv venv .wheel-smoke --python 3.14
          uv pip install --python .wheel-smoke/bin/python dist/*.whl
          .wheel-smoke/bin/python - <<'PY'
          from pathlib import Path

          import clearagent
          from clearagent import create_agent, tool
          from clearagent.chat import create_chat_app

          static_dir = Path(clearagent.__file__).parent / "chat" / "static"
          assert clearagent.__version__
          assert create_agent is not None
          assert tool is not None
          assert create_chat_app is not None
          for asset in ("app.js", "index.html", "styles.css"):
              assert (static_dir / asset).is_file()
          assert (Path(clearagent.__file__).parent / "py.typed").is_file()
          PY
          .wheel-smoke/bin/clearagent --help
